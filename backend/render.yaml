# Blueprint do Render (render.com/docs/blueprint-spec).
# No painel do Render: New -> Blueprint -> aponta pro repositório que tiver
# este arquivo na raiz, e ele cria o Web Service + o Postgres sozinho.
databases:
  - name: buildpoint-db
    plan: free
    databaseName: buildpoint
    user: buildpoint

services:
  - type: web
    name: buildpoint-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: buildpoint-db
          property: connectionString
      - key: FACE_SERVICE_PROVIDER
        value: "falso"
      - key: AWS_REKOGNITION_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: BIRDID_API_URL
        sync: false
      - key: BIRDID_API_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
